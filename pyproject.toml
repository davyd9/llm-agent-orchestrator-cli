[project]
name = "llm-agent-orchestrator-cli"
version = "0.1.0"
description = "A CLI tool to integrate multiple LLMs and orchestrate autonomous agents."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "click>=8.1.7",
    "python-dotenv>=1.0.1"
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
keywords = ["llm", "agent", "orchestration", "cli", "langchain", "crewai"]

[project.scripts]
llm-orchestrator = "llm_agent_orchestrator_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
